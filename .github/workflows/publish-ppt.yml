name: Publish compiled PPT runtime with OIDC
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify without publishing
        type: boolean
        default: true
        required: true
permissions:
  contents: read
concurrency:
  group: ppt-runtime-npm
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'flyfish-dev/pptjs' && github.repository_id == '1439507870' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
      - name: Verify compiled-only public boundary and Oracle qualification
        run: node scripts/verify-dist.mjs
      - name: Preserve exact frozen Release asset
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(node -p "JSON.parse(require('fs').readFileSync('release/npm-release.json')).version")"
          archive="$(node -p "JSON.parse(require('fs').readFileSync('release/npm-release.json')).filename")"
          if ! gh release view "$tag" --json tagName; then
            gh release create "$tag" --verify-tag --title "$tag" --notes 'Compiled Apache-2.0 PPT runtime. Development source remains private; qualification runs on Oracle.'
          fi
          mkdir -p "$RUNNER_TEMP/ppt-asset-readback"
          if gh release download "$tag" --pattern "$archive" --dir "$RUNNER_TEMP/ppt-asset-readback"; then
            cmp "release/$archive" "$RUNNER_TEMP/ppt-asset-readback/$archive"
          else
            gh release upload "$tag" "release/$archive"
          fi
      - name: Publish only the frozen archive using trusted identity
        env:
          DISTRIBUTION_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: node scripts/publish-ppt.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
